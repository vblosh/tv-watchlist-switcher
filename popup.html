<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    :root {
      --bg: #131722;
      --panel: #1e222d;
      --border: #2a2e39;
      --text: #d1d4dc;
      --muted: #787b86;
      --accent: #2962ff;
      --accent-hover: #1e53e5;
      --danger: #f23645;
      --success: #089981;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      width: 380px;
      margin: 0;
      padding: 12px;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }
    h2 { margin: 0 0 8px; font-size: 14px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    .section {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
    input[type="text"], textarea {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px 8px;
      font-size: 12px;
    }
    textarea { resize: vertical; min-height: 54px; font-family: monospace; }
    button {
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { background: var(--accent-hover); }
    button.secondary { background: var(--border); color: var(--text); }
    button.secondary:hover { background: #363a45; }
    button.danger { background: var(--danger); }
    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
    }
    .list-item:last-child { border-bottom: none; }
    .list-meta { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 195px; }
    .list-title { font-weight: 600; display: block; }
    .list-sub { font-size: 11px; color: var(--muted); }
    .actions { display: flex; gap: 4px; }
    .status { font-size: 11px; color: var(--success); min-height: 16px; margin-top: 4px; }
    .status.error { color: var(--danger); }
    label.toggle { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); cursor: pointer; }
  </style>
</head>
<body>
  <h2>
    <span>TV Watchlist Switcher</span>
    <label class="toggle">
      <input type="checkbox" id="autoReload" checked />
      Reload tab on switch
    </label>
  </h2>

  <!-- Local Saved Watchlists -->
  <div class="section">
    <div class="row" style="justify-content: space-between;">
      <strong>Local Watchlists (Unlimited)</strong>
      <button id="btnCaptureActive" class="secondary" title="Save currently active TradingView list">+ Capture Current</button>
    </div>
    <div id="localListsContainer"></div>
  </div>

  <!-- Create / Edit Watchlist -->
  <div class="section">
    <strong style="display:block; margin-bottom:6px;">New / Edit Local List (Max 30 on Basic)</strong>
    <div class="row">
      <input type="text" id="listNameInput" placeholder="List Name (e.g., Semis & AI)" />
    </div>
    <div class="row">
      <textarea id="listSymbolsInput" placeholder="NASDAQ:NVDA,NASDAQ:AMD,###Crypto,BINANCE:BTCUSDT"></textarea>
    </div>
    <div class="row" style="justify-content: space-between;">
      <button id="btnSaveList">Save Local List</button>
      <div class="actions">
        <button id="btnExportJson" class="secondary">Export JSON</button>
        <button id="btnImportJson" class="secondary">Import JSON</button>
        <input type="file" id="fileImport" accept=".json,.txt" style="display:none;" />
      </div>
    </div>
  </div>

  <!-- Cloud Lists Detected on Account -->
  <div class="section">
    <div class="row" style="justify-content: space-between;">
      <strong>Account Cloud Lists (Locked / Active)</strong>
      <button id="btnRefreshCloud" class="secondary">Refresh</button>
    </div>
    <div id="cloudListsContainer">
      <span class="list-sub">Open a tradingview.com tab to inspect cloud lists.</span>
    </div>
  </div>

  <div id="statusBar" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
